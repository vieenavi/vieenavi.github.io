*{box-sizing:border-box}html{scroll-behavior:smooth}figure{margin:0}b{font-weight:400}
body{margin:0;color:var(--bone);font:1.08rem/1.7 'IM Fell English',Georgia,serif;cursor:crosshair;overflow-x:hidden;background:radial-gradient(ellipse 80% 45% at 50% 0,rgba(142,14,36,.32),transparent),repeating-linear-gradient(45deg,transparent 0 41px,rgba(142,14,36,.08) 41px 42px),repeating-linear-gradient(-45deg,transparent 0 41px,rgba(142,14,36,.08) 41px 42px),var(--crypt)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;background:url(https://github.com/user-attachments/assets/619bd938-a006-4862-b8ce-0077c19ecd6a) right bottom/auto 92vh no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.05;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
a,button{cursor:pointer}:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(1rem,4vw,3rem)}
section{position:relative;padding:4.5rem 0}
h2{font:700 clamp(2.6rem,6.5vw,4rem)/1 'UnifrakturCook',serif;margin:0 0 .4rem}
.sub{margin:0 0 2rem;color:var(--pew);font-style:italic}
.nav{position:sticky;top:0;z-index:30;display:flex;justify-content:center;gap:3rem;padding:.9rem 1rem;background:rgba(10,4,6,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--blood);font-style:italic;letter-spacing:.12em}
.nav a{color:var(--pew);text-decoration:none;padding-bottom:.1rem;border-bottom:1px solid transparent;transition:.2s}.nav a:hover,.nav a.on{color:var(--bone)}.nav a.on{border-color:var(--rose)}
.hero{position:relative;min-height:92vh;display:flex;align-items:center;overflow:hidden}
.arch{position:absolute;top:0;left:0;height:min(560px,72vh,78vw);opacity:.88;filter:brightness(1.35) drop-shadow(0 0 14px #000);pointer-events:none}.arch.r{left:auto;right:0;scale:-1 1}
.drape{position:absolute;top:0;right:7%;width:clamp(150px,22vw,300px);pointer-events:none;filter:drop-shadow(0 10px 18px #000)}
.vert{position:absolute;left:clamp(.5rem,1.6vw,1.4rem);bottom:3rem;writing-mode:vertical-rl;rotate:180deg;margin:0;font-style:italic;letter-spacing:.3em;font-size:.85rem;color:var(--pew)}
.hin{position:relative;z-index:2;width:100%;max-width:980px;margin:0 auto;padding:7rem clamp(1.4rem,5vw,3rem) 4rem}
.kick{margin:0 0 .6rem;color:var(--rose);font-style:italic}
h1{margin:0;font:700 clamp(4.4rem,16vw,11.5rem)/.84 'UnifrakturCook',serif;text-shadow:0 0 50px rgba(142,14,36,.55)}
h1 span{display:block}h1 span+span{color:var(--rose);margin-left:clamp(2rem,10vw,7rem)}
.def{max-width:34rem;margin:2.4rem 0 0;padding-left:1.1rem;border-left:2px solid var(--blood);color:var(--pew)}
.def b{color:var(--bone);font-size:1.25rem}.def span{color:var(--rose);font-style:italic}
.go{display:inline-block;margin-top:2rem;border-bottom:1px solid var(--rose);color:var(--rose);font-style:italic;text-decoration:none}
.about,.sch{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:3.5rem 4.5rem;align-items:start}.sch{grid-template-columns:1fr 1fr}
.duo{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2.6rem 2rem}

.fr img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;filter:grayscale(.5) contrast(1.1) sepia(.25);transition:filter .5s}.fr:hover img{filter:none}
.fr figcaption{position:absolute;z-index:2;background:var(--blood);padding:.05rem .85rem;font-style:italic;line-height:1.5}
.photo{flex:1 1 200px;max-width:250px;rotate:-2.2deg}.tag{right:-10px;bottom:3%;rotate:3deg}
.live{flex:1 1 260px;max-width:330px;position:relative;margin-top:3.5rem}
.win{position:relative;aspect-ratio:4/5;border-radius:50% 50% 5px 5px/34% 34% 5px 5px;background:radial-gradient(ellipse at 50% 30%,#5e1022,#25060e 60%,#0b0306);box-shadow:0 0 0 3px var(--crypt),0 0 0 6px #a99d93,0 0 0 8px var(--crypt),0 0 0 9px #6b5f57,0 0 50px rgba(142,14,36,.4)}
.win::after{content:"";position:absolute;inset:auto 0 0;height:7%;background:var(--crypt);border-top:1px solid var(--blood)}
/* karakter: semua layer = kanvas persegi 3072x3072 -> stage 1:1, tiap layer nempel persis */
.stage{position:absolute;left:50%;bottom:7%;width:118%;aspect-ratio:1;translate:-50% 0;z-index:2;clip-path:inset(-70% -40% 0 -40%)}
.l{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;will-change:transform;transform-origin:50% 80%}
.l[data-r=a]{transform-origin:50% 60%}.l[data-r=b]{transform-origin:80% 100%}
.live figcaption{margin-top:1.3rem;text-align:center;font:700 1.55rem 'UnifrakturCook',serif;color:var(--rose)}
.claws{position:absolute;left:-26px;bottom:44px;width:62px;rotate:-14deg;z-index:3;pointer-events:none;filter:drop-shadow(0 4px 6px #000)}
/* player = nameplate: piringan di lingkaran, video di banner */
.player{position:relative;aspect-ratio:593/405;margin-top:3rem}
.player::after{content:"";position:absolute;inset:0;background:url(assets/nameplate.png) 0 0/100% 100% no-repeat;pointer-events:none}
.vinyl{position:absolute;left:14.4%;top:23.7%;width:27.5%;aspect-ratio:1;border-radius:50%;object-fit:cover}
.on .vinyl{animation:spin 4s linear infinite}@keyframes spin{to{rotate:360deg}}
.player video{position:absolute;z-index:1;left:42.4%;top:35.5%;width:50%;height:17.5%;object-fit:cover;filter:grayscale(1);opacity:.85;transition:.3s}.player video:hover{filter:none;opacity:1}
.np{position:absolute;left:42.4%;top:57%;margin:0;color:var(--rose);font-style:italic}
.txt h3{margin:0 0 1rem;font-size:1.6rem;font-weight:400}.txt h3 small{color:var(--pew);font-size:1rem;font-style:italic}
.txt p{max-width:62ch;margin:0 0 1.1rem}.txt p+p{color:var(--pew)}
.drop::first-letter{float:left;padding:.4rem .55rem 0 0;font:700 4.4rem/.78 'UnifrakturCook',serif;color:var(--rose)}
.links{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.6rem}
.links a,.links button{font:italic 1.05rem 'IM Fell English',serif;color:var(--bone);text-decoration:none;background:none;border:1px solid var(--pew);padding:.4rem 1.2rem;transition:.2s}.links a:hover,.links button:hover{background:var(--blood);border-color:var(--rose)}
.sk{display:grid;gap:.9rem;margin-top:2.4rem}.sk h4{margin:0;font:700 1.6rem 'UnifrakturCook',serif}
.sk div{display:grid;grid-template-columns:9rem 1fr;align-items:center;gap:1rem;font-style:italic}
.sk i{display:block;height:3px;background:#2a1a1e}.sk b{display:block;height:100%;background:var(--pew)}.sk .hot{color:var(--rose)}.sk .hot b{background:var(--rose);box-shadow:0 0 8px var(--blood)}
.tl{list-style:none;margin:0;padding:0 0 0 2.2rem;border-left:1px solid var(--blood);display:grid;gap:2.2rem}
.tl li{position:relative}.tl li::before{content:"";position:absolute;left:-2.55rem;top:.7rem;width:.7rem;height:.7rem;background:var(--rose);rotate:45deg}
.tl time{display:block;color:var(--rose);font-style:italic}.tl b{display:block;font-size:1.5rem;line-height:1.25}.tl span{color:var(--pew);font-style:italic}
.note{padding:1.6rem 1.8rem;border:1px solid var(--line);border-left:3px solid var(--rose);background:rgba(43,10,18,.5)}
.note h3{margin:0;font:700 1.8rem/1.2 'UnifrakturCook',serif}.note .now{margin:.2rem 0 .8rem;color:var(--rose);font-style:italic}.note p{margin:0;color:var(--pew)}
.tiles{display:flex;flex-wrap:wrap;gap:.9rem}
.tiles div{width:6.6rem;aspect-ratio:1;display:grid;place-content:center;text-align:center;border:1px solid var(--line);background:rgba(43,10,18,.5);box-shadow:inset 0 0 0 4px var(--crypt),inset 0 0 0 5px rgba(142,14,36,.55);transition:background .2s}.tiles div:hover{background:rgba(142,14,36,.3)}
.tiles b{font:700 2.1rem/1.2 'UnifrakturCook',serif;color:var(--rose)}.tiles span{font-size:.85rem;color:var(--pew)}
.kv{display:grid;grid-template-columns:9.5rem 1fr;gap:.6rem 1.2rem;margin:2.4rem 0 0}.kv dt{color:var(--rose);font-style:italic}.kv dd{margin:0}
.curtain{position:absolute;top:-1rem;right:0;width:clamp(120px,18vw,240px);pointer-events:none;filter:drop-shadow(0 10px 16px #000)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:3.2rem 2.2rem;padding-top:1rem}
.gal .fr{cursor:zoom-in}.gal .fr:nth-child(odd){rotate:-1deg}.gal .fr:nth-child(even){rotate:1.2deg}
.gal figcaption{left:50%;bottom:-.3rem;translate:-50% 0}
dialog{background:none;border:0;padding:0;max-width:94vw;max-height:94vh}dialog img{display:block;max-width:94vw;max-height:94vh;object-fit:contain;cursor:zoom-out}dialog::backdrop{background:rgba(10,4,6,.93)}
.band{overflow:hidden;border-block:1px solid var(--blood);background:rgba(142,14,36,.14);padding:.4rem 0}
.mq{display:flex;width:max-content;animation:mq 32s linear infinite}.mq span{padding-right:3.2rem;white-space:nowrap;font-style:italic;color:var(--rose)}@keyframes mq{to{transform:translateX(-50%)}}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:2rem;padding-top:3.5rem;padding-bottom:3rem}

/* ===== KARAKTER: urutan layer dari bawah ke atas. Role: h=kepala, e=mata (ikut kursor), a=rambut, b=tangan ===== */
const st=$('stage');
if(st){
const REG={l:{x:.0622,y:0,h:1},c:{x:.0622,y:0,h:1}},
/* urutan layer dari bawah ke atas. e=mata (ikut kursor), h=kepala, a=rambut, b=tangan. cap & lash berukuran 900x1028, posisinya diatur di REG (buka index.html?tune buat geser pakai keyboard) */
L=[['2f314dbc-adbd-471e-9a50-a2df62fbc42d','h'],['56a296e5-dbc2-4d85-b3d8-debf39b5c0f5','e'],['1c00630c-7d8f-45eb-8aab-e789a9098f9d','e'],['985f13aa-d31f-4bd1-806c-a17bf2f0b51e','e'],['e42c82b1-4583-4620-bc31-3743f38832f0','e'],['7d3d8911-821b-41ae-aa9d-af1dbacfc779','h','c'],['756c8313-3cd6-4c6f-8045-6e8fde5e5db1','h','l'],['2da8723a-db5b-47eb-bb6f-28c910517396','h'],['bcd058b5-7f7a-42af-94aa-22edec1dddc0','a'],['3fc14341-352a-4af1-aa86-842ac1fd60d5','b']];
st.innerHTML=L.map(([id,r,k])=>k?`<div class="l" data-r="${r}"><img class="q" data-k="${k}" src="${G+id}" alt="" draggable="false"></div>`:`<img class="l" data-r="${r}" src="${G+id}" alt="" draggable="false">`).join('');
const place=()=>st.querySelectorAll('.q').forEach(i=>{const r=REG[i.dataset.k];i.style.cssText=`left:${r.x*100}%;top:${r.y*100}%;height:${r.h*100}%`});place();
const P={};st.querySelectorAll('.l').forEach(e=>(P[e.dataset.r]??=[]).push(e));

const show=()=>o.textContent=`TUNE  1=lash  2=cap | panah=geser | + / - = ukuran | shift=cepat | aktif: ${k}\nREG=${JSON.stringify(REG,(a,v)=>typeof v=='number'?+v.toFixed(4):v)}`;show();
addEventListener('keydown',e=>{const r=REG[k],f=(e.shiftKey?5:1)*.002;if(e.key=='1')k='l';if(e.key=='2')k='c';
if(e.key.startsWith('Arrow')){e.preventDefault();r[/Left|Right/.test(e.key)?'x':'y']+=/Left|Up/.test(e.key)?-f:f}
if(e.key.length==1&&'+=-'.includes(e.key)){const d=e.key=='-'?-f:f;r.h+=d;r.x-=d*900/1028/2;r.y-=d/2}
place();show()})}
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches,c={g:[0,0],h:[0,0],a:[0,0],b:[0,0]};
let tx=0,ty=0,seen=-1e5,next=0,p=performance.now();
const aim=(x,y)=>{const r=st.getBoundingClientRect(),dx=x-(r.left+r.width*.5),dy=y-(r.top+r.height*.4),d=Math.hypot(dx,dy)||1,k=Math.min(d/280,1);tx=dx/d*k;ty=dy/d*k;seen=performance.now()};
addEventListener('pointermove',e=>aim(e.clientX,e.clientY),{passive:true});
addEventListener('pointerdown',e=>aim(e.clientX,e.clientY),{passive:true});
const ease=(v,f,dt)=>{const k=1-Math.pow(1-f,dt);v[0]+=(tx-v[0])*k;v[1]+=(ty-v[1])*k},set=(k,t)=>(P[k]||[]).forEach(e=>e.style.transform=t);
(function tick(t){
const dt=Math.min((t-p)/16.7,4);p=t;
if(!calm&&t-seen>3000&&t>next){tx=(Math.random()*2-1)*.9;ty=(Math.random()-.4)*.8;next=t+1600+Math.random()*2400}
ease(c.g,.2,dt);ease(c.h,.07,dt);ease(c.a,.045,dt);ease(c.b,.05,dt);
const w=st.offsetWidth,s=calm?0:t/1000,br=Math.sin(s*1.4),H=`translate(${c.h[0]*.012*w}px,${c.h[1]*.006*w+br*.002*w}px) rotate(${c.h[0]*1.4}deg)`;
set('h',H);set('e',`${H} translate(${c.g[0]*.016*w}px,${c.g[1]*.008*w}px)`);
set('a',`translate(${c.a[0]*.02*w}px,${c.a[1]*.01*w+br*.003*w}px) rotate(${c.a[0]*-.9}deg)`);
set('b',`translate(${-c.b[0]*.03*w}px,${-c.b[1]*.012*w+Math.sin(s*.9+1)*.006*w}px) rotate(${-c.b[0]*2.4}deg)`);
requestAnimationFrame(tick)})(performance.now());
}
